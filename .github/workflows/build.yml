name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # Intel runners: the arm64 ones were often full and never picked up the job. The app is still built universal.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Self-test
        # The debug build checks key conversion, recording, macros, config limits and more, then exits.
        run: KB_SELFTEST=1 .build/debug/ShiftHappens
      - name: Build app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Shift Happens
          path: build/Shift Happens.zip
