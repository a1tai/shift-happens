name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build (debug)
        run: swift build
      - name: Self-test
        # The debug build checks key conversion, recording, macros, config limits and more, then exits.
        run: KB_SELFTEST=1 .build/debug/KeyBindingApp
      - name: Build app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Shift Happens
          path: build/Shift Happens.zip
