name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Intel runners: the arm64 ones were often full and never picked up the job. The app is still built universal.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: swift build && KB_SELFTEST=1 .build/debug/ShiftHappens
      - name: Import signing certificate
        # One self-signed certificate for every release keeps the app's signature the same between versions,
        # so macOS keeps the Input Monitoring and Accessibility permissions across updates.
        # Without the secrets (forks) the app is signed ad hoc.
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$CERT_P12" ]; then echo "No signing certificate: signing ad hoc"; exit 0; fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign > /dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=Shift Happens" >> "$GITHUB_ENV"
      - name: Build app
        # Not notarized: users see a Gatekeeper warning on first open (see README).
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The asset name has no space (GitHub would turn it into a dot); notes are this version's CHANGELOG section.
        run: |
          cp "build/Shift Happens.zip" Shift-Happens.zip
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" Shift-Happens.zip --title "Shift Happens $GITHUB_REF_NAME" --notes-file notes.md
