name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Intel runners: the arm64 ones were often full and never picked up the job. The app is still built universal.
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: swift build && KB_SELFTEST=1 .build/debug/ShiftHappens
      - name: Build app
        # Signed ad hoc: users see a Gatekeeper warning on first open (see README).
        run: VERSION="${GITHUB_REF_NAME#v}" ./scripts/build-app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The asset name has no space (GitHub would turn it into a dot); notes are this version's CHANGELOG section.
        run: |
          cp "build/Shift Happens.zip" Shift-Happens.zip
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "## " v " ") == 1; next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" Shift-Happens.zip --title "Shift Happens $GITHUB_REF_NAME" --notes-file notes.md
